[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0258",
    # crypto-bigint 0.5 (timing variability of operations meant to be constant-time; fixed in
    # 0.7.6, which elliptic-curve 0.13 cannot use). Pulled by jsonwebtoken 11.1 (the latest
    # release) through p256/p384, so only ES256/ES384 signature verification reaches it; other
    # algorithms (HMAC, RSA, EdDSA) do not. This crate runs that verification with the
    # Keycloak realm's public keys only: no secret goes through these operations. Drop it once
    # jsonwebtoken moves to elliptic-curve 0.14, and remove it at once if code starts signing
    # with (or otherwise using) an EC private key.
    "RUSTSEC-2026-0387",
    # libsqlite3-sys 0.37 (C SQLite CVE-2026-119375, fixed in >= 0.39), MAIR-740. It is only listed in
    # Cargo.lock through sqlx's weak `sqlx-sqlite?/...` features: `cargo tree -i libsqlite3-sys
    # --target all --all-features` prints nothing, it is never compiled into the binary. sqlx 0.9
    # pins 0.37. Drop it once sqlx moves to libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459"
]
