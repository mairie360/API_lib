[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0258",
    # crypto-bigint 0.5 (timing variability of operations meant to be constant-time; fixed in
    # 0.7.6, which elliptic-curve 0.13 cannot use). Pulled by jsonwebtoken 11.1 (the latest
    # release, through p256/p384), which this crate only uses to *verify* ES256/ES384 Keycloak
    # signatures with the realm's public keys: no secret goes through these operations. Drop it
    # once jsonwebtoken moves to elliptic-curve 0.14, and remove it at once if code starts signing
    # with (or otherwise using) an EC private key.
    "RUSTSEC-2026-0387",
]
