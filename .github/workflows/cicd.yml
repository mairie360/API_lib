name: API-Lib-CI/CD

on:
  push:
  workflow_dispatch:

jobs:
  CICD:
    uses: mairie360/CICD/.github/workflows/back-lib-cicd.yml@v5.16.1
    with:
      cicd_version: v5.16.1
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit -- the called workflow is our own centralized CICD
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PK: ${{ secrets.RELEASE_APP_PK }}
