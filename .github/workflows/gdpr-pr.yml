# GDPR checklist of the pull requests (MAIR-295): the "Personal data" section of the description
# (organization PR template, mairie360/.github) must be answered, and a "Yes" must go with the
# personal data inventory (Devops/Database gdpr/inventory.yaml). Runs on `edited` too, so that
# ticking the answer re-runs it. The check it reports is named "gdpr / GDPR checklist" (caller job
# id / job name of gdpr-pr-cicd.yml): that is the name to mark required in the branch protection.
name: GDPR PR checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  gdpr:
    uses: mairie360/CICD/.github/workflows/gdpr-pr-cicd.yml@v4.12.0
    with:
      cicd_version: v4.12.0
    # Only the secrets of the (optional, never blocking) AI review, not every secret of the repo.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
