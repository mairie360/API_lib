[package]
name = "mairie360_api_lib"
version = "1.0.0"
authors = ["Quentin TENNEREL <quentin.tennerel@epitech.eu>"]
edition = "2021"
description = "Lib for mairie360 APIs"
license = "MIT"
repository = "https://github.com/mairie360/API_lib"
exclude = [
    "cicd-repo/**",
    ".github/**"
]

[dependencies]
actix-web = "4"
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.8"
chrono = { version = "0.4", features = ["serde"] }
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }
futures-util = "0.3"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
lazy_static = "1.4"
once_cell = "1.21.3"
redis = "1.0.3"
regex = "1"
reqwest = { version = "0.13.4", features = ["json"] }
resend-rs = "0.32.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.9.0", features = ["postgres", "ipnetwork", "uuid", "runtime-tokio", "tls-rustls", "chrono"] }
testcontainers = "0.28.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
mairie360_api_lib = { path = ".", features = ["test-utils"] }
serial_test = "4.0.0"
temp-env = "0.3.6"
postgres = "0.19"

[features]
default = []
test-utils = []
