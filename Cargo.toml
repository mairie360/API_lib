[package]
name = "mairie360_api_lib"
version = "1.4.1"
authors = ["Quentin TENNEREL <quentin.tennerel@epitech.eu>"]
edition = "2021"
description = "Lib for mairie360 APIs"
license = "MIT"
repository = "https://github.com/mairie360/API_lib"
readme = "README.md"
keywords = ["mairie360", "actix-web", "api", "jwt", "postgres"]
categories = ["web-programming", "database"]
exclude = [
    "cicd-repo/**",
    ".github/**"
]

[dependencies]
actix-web = "4"
anyhow = "1.0.102"
argon2 = { version = "0.6", features = ["password-hash", "getrandom"] }
async-trait = "0.1.89"
axum = "0.8.8"
chrono = { version = "0.4", features = ["serde"] }
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }
futures-util = "0.3"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
libc = "0.2"
redis = "1.0.3"
regex = "1"
reqwest = { version = "0.13.4", features = ["json"] }
resend-rs = "0.32.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.9.0", features = ["postgres", "ipnetwork", "uuid", "runtime-tokio", "tls-rustls", "chrono"] }
testcontainers = "0.28.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
mairie360_api_lib = { path = ".", features = ["test-utils"] }
serial_test = "4.0.0"
temp-env = "0.3.6"
postgres = "0.19"

[features]
default = []
test-utils = []

[lints.clippy]
# Niveau le plus exigeant : tous les groupes sauf `restriction` (non prévu pour être activé en bloc).
# `cargo lint_check` les passe en erreur via `-D warnings`.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Doublons de versions tirés par les dépendances (sqlx, testcontainers, reqwest…) : hors de notre contrôle.
multiple_crate_versions = "allow"
# Les middlewares et handlers actix-web s'exécutent sur un runtime mono-thread : leurs futures sont !Send par conception.
future_not_send = "allow"
