[package]
name = "mairie360_api_lib"
version = "4.2.1"
authors = ["Quentin TENNEREL <quentin.tennerel@epitech.eu>"]
edition = "2021"
description = "Lib for mairie360 APIs"
license = "MIT"
repository = "https://github.com/mairie360/API_lib"
readme = "README.md"
keywords = ["mairie360", "actix-web", "api", "jwt", "postgres"]
categories = ["web-programming", "database"]
exclude = [
    "cicd-repo/**",
    ".github/**"
]

[dependencies]
actix-web = "4"
anyhow = "1.0.102"
argon2 = { version = "0.6", features = ["password-hash", "getrandom"] }
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }
futures-util = "0.3"
governor = "0.10"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
libc = { version = "0.2", optional = true }
# OpenTelemetry (`otel` feature, MAIR-503). `tracing-actix-web` only supports OpenTelemetry up to
# 0.32 and `tracing-opentelemetry` 0.33 is the release paired with it: bump all of them together.
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client", "reqwest-rustls"], optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
percent-encoding = "2"
redis = "1.0.3"
regex = "1"
reqwest = { version = "0.13.4", features = ["json"] }
resend-rs = "0.34.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["postgres", "ipnetwork", "uuid", "runtime-tokio", "tls-rustls", "chrono"] }
testcontainers = { version = "0.28.0", optional = true }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"], optional = true }
tracing = "0.1.44"
# `request_log` (feature `tracing-actix`, MAIR-290) and `TracingLogger` (feature `otel`, MAIR-503).
# No default feature: `emit_event_on_error` logs the `Debug` of every error.
tracing-actix-web = { version = "0.7.25", default-features = false, optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
# Usage telemetry (feature `usage`, MAIR-501): the random salt of the user id hashes, per period.
getrandom = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
mairie360_api_lib = { path = ".", features = ["test-utils", "otel", "tracing-actix", "usage"] }
# Captures what actix's `Logger` writes (request_log tests).
log = "0.4"
serial_test = "4.0.0"
temp-env = "0.3.6"
postgres = "0.19"
url = "2"

[features]
default = []
# Test helpers for the APIs' own tests: `test_setup` (Postgres/Redis containers, seeded fixtures,
# Keycloak mock) and `email::mock_client`. Enable it in `[dev-dependencies]` only, never in
# `[dependencies]`: it pulls testcontainers into the binary.
# With `otel`, it also turns on `opentelemetry_sdk/testing` (`InMemorySpanExporter`).
test-utils = ["dep:testcontainers", "dep:tokio-postgres", "dep:libc", "opentelemetry_sdk?/testing"]
# Trace export (MAIR-503): `logging::telemetry`, OTLP/HTTP to the collector, one span per request
# through `TracingLogger`. Every API enables it in `[dependencies]`.
otel = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-actix-web", "tracing-actix-web/opentelemetry_0_32", "dep:tracing-opentelemetry"]
# `request_log::{hide_query, restore_query, RedactedRootSpanBuilder, describe_error}` for the APIs
# that use tracing-actix-web (Core_API, Message_API). `request_logger` needs no feature.
tracing-actix = ["dep:tracing-actix-web"]
# `usage::{UsageLedger, usage_middleware, usage_metrics}`: aggregated usage counts without any
# identifier (MAIR-501).
usage = ["dep:getrandom"]

[lints.clippy]
# Niveau le plus exigeant : tous les groupes sauf `restriction` (non prévu pour être activé en bloc).
# `cargo lint_check` les passe en erreur via `-D warnings`.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Doublons de versions tirés par les dépendances (sqlx, testcontainers, reqwest…) : hors de notre contrôle.
multiple_crate_versions = "allow"
# Les middlewares et handlers actix-web s'exécutent sur un runtime mono-thread : leurs futures sont !Send par conception.
future_not_send = "allow"
